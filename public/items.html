<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Browse Items | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .items-page {
            min-height: 100vh;
            background: #f5f8ff;
        }

        .items-container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 50px 0;
        }

        .items-header {
            margin-bottom: 35px;
        }

        .items-header h1 {
            font-size: 36px;
            color: #172033;
            margin-bottom: 10px;
        }

        .items-header p {
            color: #667085;
        }

        .items-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }

        .item-card {
    background: white;
    border-radius: 18px;
    padding: 22px;

    border: 1px solid #e8eef8;

    box-shadow:
        0 8px 25px
        rgba(25, 70, 140, 0.08);

    transition: 0.25s ease;
}

.item-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 15px 35px
        rgba(25, 70, 140, 0.13);
}
/* Recovered items are shown less prominently */
.item-card.recovered-card {
    opacity: 0.75;
    transform: scale(0.97);
    box-shadow: 0 4px 15px rgba(25, 70, 140, 0.05);
}

.item-card.recovered-card:hover {
    opacity: 0.9;
    transform: scale(0.98);
}

        .item-icon {
            width: 60px;
            height: 60px;

            border-radius: 14px;

            background: #eef2ff;
            color: #4f46e5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;

            margin-bottom: 18px;
        }
        .item-image {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 18px;
    display: block;
    background: #f1f5f9;
}

.item-image-placeholder {
    width: 100%;
    height: 220px;
    border-radius: 12px;
    background: #eef2ff;
    color: #4f46e5;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;

    margin-bottom: 18px;
}

        .item-card h3 {
            color: #172033;
            margin-bottom: 10px;
        }

        .item-card p {
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .item-status {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.item-status.lost {
    background: #fee2e2;
    color: #dc2626;
}

.item-status.recovered {
    background: #e0e7ff;
    color: #4338ca;
}

        .empty-message {
            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 16px;

            color: #667085;
        }

        @media (max-width: 900px) {

            .items-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .items-grid {
                grid-template-columns: 1fr;
            }

            .items-header h1 {
                font-size: 28px;
            }

        }
.items-filters {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
}

.items-filters input,
.items-filters select {
    padding: 14px 16px;
    border: 1px solid #d0d5dd;
    border-radius: 12px;
    background: white;
    font-size: 14px;
    outline: none;
    transition: 0.2s ease;
}

.items-filters input {
    flex: 1;
}

.items-filters input:focus,
.items-filters select:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
}

@media (max-width: 600px) {

    .items-filters {
        flex-direction: column;
    }

}
    </style>

</head>


<body class="items-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Campus<span>Find</span>
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="items.html" class="active">
                Browse Items
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </nav>

    </header>


    <!-- ITEMS -->

    <main class="items-container">

        <div class="items-header">

            <h1>
                Lost & Found Items
            </h1>

            <p>
                Browse items reported by students
                on campus.
            </p>

        </div>
       
<div class="items-filters">

    <input
        type="text"
        id="searchInput"
        placeholder="Search for an item..."
    >

    <select id="statusFilter">

        <option value="ALL">
            All Items
        </option>

        <option value="LOST">
            Lost Items
        </option>

        <option value="FOUND">
            Found Items
        </option>

        <option value="RECOVERED">
    Recovered Items
</option>

    </select>

</div>

        <div id="itemsContainer"
             class="items-grid">

            <div class="empty-message">

                Loading items...

            </div>

        </div>

    </main>


    <script>

let allItems = [];

console.log("CampusFind items.js is running");

const container = document.getElementById("itemsContainer");
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");

const params = new URLSearchParams(window.location.search);
const searchQuery = params.get("search");

if (searchQuery) {
    searchInput.value = searchQuery;
}


// ========================================
// LOAD ITEMS
// ========================================

Promise.all([
    fetch("/api/lost-items").then(response => {
        if (!response.ok) {
            throw new Error("Failed to load lost items");
        }

        return response.json();
    }),

    fetch("/api/found-items").then(response => {
        if (!response.ok) {
            throw new Error("Failed to load found items");
        }

        return response.json();
    })
])

.then(([lostItems, foundItems]) => {

    console.log("Lost items:", lostItems);
    console.log("Found items:", foundItems);

   allItems = [
    ...lostItems.map(item => ({
        ...item,
        status: item.status === "RECOVERED"
            ? "RECOVERED"
            : "LOST"
    })),

    ...foundItems.map(item => ({
        ...item,
        status: item.status === "RECOVERED"
            ? "RECOVERED"
            : "FOUND"
    }))
];
    console.log("All items:", allItems);

    displayItems();

})

.catch(error => {

    console.error("Loading error:", error);

    container.innerHTML = `
        <div class="empty-message">
            Unable to load items.
            <br>
            <small>${error.message}</small>
        </div>
    `;

});


// ========================================
// DISPLAY ITEMS
// ========================================

function displayItems() {

    const searchText =
        searchInput.value.toLowerCase().trim();

    const selectedStatus =
        statusFilter.value;


    const filteredItems =
        allItems.filter(item => {

            const itemName =
                item.item_name || "";

            const description =
                item.description || "";

            const location =
                item.location || "";


            const matchesSearch =
                itemName.toLowerCase().includes(searchText) ||
                description.toLowerCase().includes(searchText) ||
                location.toLowerCase().includes(searchText);


            const matchesStatus =
                selectedStatus === "ALL" ||
                item.status === selectedStatus;


            return matchesSearch && matchesStatus;

        });


    if (filteredItems.length === 0) {

        container.innerHTML = `
            <div class="empty-message">
                No matching items found.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    filteredItems.forEach(item => {

        const card =
            document.createElement("div");

       card.className =
    item.status === "RECOVERED"
        ? "item-card recovered-card"
        : "item-card";

card.style.cursor = "pointer";

card.addEventListener("click", () => {

    const type =
    item.status === "LOST" || item.status === "RECOVERED"
        ? "lost"
        : "found";
        
    window.location.href =
        `/item-details.html?type=${type}&id=${item.id}`;

});

      const statusClass =
    item.status === "LOST"
        ? "lost"
        : item.status === "FOUND"
            ? "found"
            : "recovered";

        const rawDate =
    item.status === "LOST"
        ? item.lost_date
        : item.found_date;

const date = rawDate
    ? new Date(rawDate).toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    })
    : "Not specified";

        let imageHTML;


        if (item.image) {

            let imagePath = item.image;

            if (!imagePath.startsWith("/")) {
                imagePath = "/uploads/" + imagePath;
            }

            imageHTML = `
                <img
                    src="${imagePath}"
                    alt="${item.item_name || "Item image"}"
                    class="item-image"
                >
            `;

        } else {

            imageHTML = `
                <div class="item-image-placeholder">
                    ${item.status === "LOST" ? "🔍" : "🎒"}
                </div>
            `;

        }


        card.innerHTML = `

            ${imageHTML}

            <span class="item-status ${statusClass}">
                ${item.status}
            </span>

            <h3>
                ${item.item_name || "Unnamed item"}
            </h3>

            <p>
                <strong>Description:</strong>
                ${item.description || "No description"}
            </p>

            <p>
                <strong>Location:</strong>
                ${item.location || "Not specified"}
            </p>

            <p>
                <strong>Date:</strong>
                ${date || "Not specified"}
            </p>

            <p>
                <strong>Contact:</strong>
                ${item.contact || "Not specified"}
            </p>

        `;


        container.appendChild(card);

    });

}


// ========================================
// SEARCH
// ========================================

searchInput.addEventListener(
    "input",
    displayItems
);


// ========================================
// STATUS FILTER
// ========================================

statusFilter.addEventListener(
    "change",
    displayItems
);

</script>

</body>
</html>
