<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .reports-container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 40px 0;
        }

        .reports-container h1 {
            color: #172033;
            margin-bottom: 10px;
        }

        .reports-container > p {
            color: #667085;
            margin-bottom: 30px;
        }

        #reports {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .report-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #e8eef8;
            box-shadow: 0 8px 25px rgba(25, 70, 140, 0.08);
        }

        .report-card img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .report-card h3 {
            color: #172033;
            margin-bottom: 10px;
        }

        .report-card p {
            color: #667085;
            margin: 7px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4f46e5;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .no-reports {
            background: white;
            padding: 30px;
            border-radius: 15px;
            color: #667085;
        }

        @media (max-width: 700px) {
            #reports {
                grid-template-columns: 1fr;
            }
        }
        .recover-btn {
    margin-top: 18px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #172033;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.recover-btn:hover {
    opacity: 0.9;
}
.delete-btn {
    margin-top: 12px;
    padding: 11px 18px;
    border: none;
    border-radius: 10px;
    background: #fee2e2;
    color: #dc2626;
    font-weight: 600;
    cursor: pointer;
}

.delete-btn:hover {
    background: #fecaca;
}
.recovered-message {
    margin-top: 18px;
    padding: 11px 15px;
    border-radius: 10px;
    background: #ecfdf3;
    color: #027a48;
    font-weight: 600;
}
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        Campus<span>Find</span>
    </div>

    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="items.html">
            Browse Items
        </a>

        <a href="index.html#how-it-works">
            How It Works
        </a>

        <div class="account-container">

            <button class="account-icon"
                    type="button"
                    title="My Account"
                    aria-label="My Account">

                <i class="fa-solid fa-user"></i>

            </button>

            <div class="account-menu" id="accountMenu">

                <a href="my-account.html">
                    <i class="fa-solid fa-user"></i>
                    My Account
                </a>

                <a href="my-reports.html">
                    <i class="fa-solid fa-clipboard-list"></i>
                    My Reports
                </a>

                <button id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </button>

            </div>

        </div>

    </nav>

</header>

<main class="reports-container">

    <h1>My Reports</h1>

    <p>
        View the lost and found items you have reported.
    </p>

    <div id="reports">
        <p>Loading your reports...</p>
    </div>

</main>

<script>

fetch("/api/my-reports")

    .then(response => {

        if (!response.ok) {
            throw new Error("Please login first.");
        }

        return response.json();

    })

    .then(reports => {

        const container = document.getElementById("reports");

        if (reports.length === 0) {

            container.innerHTML = `
                <div class="no-reports">
                    You have not reported any items yet.
                </div>
            `;

            return;
        }

        container.innerHTML = reports.map(report => {

            return `
                <div class="report-card">

                    ${
    report.image
    ? `<img src="${report.image}" alt="Item Image" style="display:block; width:100%; max-width:400px; height:250px; object-fit:cover; border-radius:12px; margin-bottom:20px;">`
    : `<p>No image uploaded.</p>`
}

                    <span class="status">
                        ${report.status}
                    </span>

                    <h3>${report.item_name}</h3>

                    <p>
                        <strong>Description:</strong>
                        ${report.description}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${report.location}
                    </p>

                  <p>
    <strong>Date:</strong>
    ${new Date(report.report_date).toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    })}
</p>
                    <p>
    <strong>Contact:</strong>
    ${report.contact}
</p>

${
    report.status === "RECOVERED"
    ? `
        <div class="recovered-message">
            <i class="fa-solid fa-circle-check"></i>
            Recovered
        </div>
    `
    : `
        <button
            class="recover-btn"
            onclick="markRecovered('${report.report_type}', ${report.id})">
            <i class="fa-solid fa-circle-check"></i>
            Mark as Recovered
        </button>
    `
}

<button
    class="delete-btn"
    onclick="deleteReport('${report.report_type}', ${report.id})">
    <i class="fa-solid fa-trash"></i>
    Delete Report
</button>


                </div>
            `;

        }).join("");

    })

    .catch(error => {

    document.getElementById("reports").innerHTML = `
        <div class="no-reports">
            ${error.message}
            <br><br>
            <a href="login.html">Go to Login</a>
        </div>
    `;

});


// ================================
// MARK REPORT AS RECOVERED
// ================================

async function markRecovered(type, id) {

    const confirmed = confirm(
        "Are you sure this item has been recovered?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `/api/reports/${type}/${id}/recovered`,
            {
                method: "PUT"
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Failed to update report"
            );
        }

        alert("Report marked as recovered!");

        location.reload();

    } catch (error) {

        alert(error.message);

    }

}
// ================================
// DELETE REPORT
// ================================

async function deleteReport(type, id) {

    const confirmed = confirm(
        "Are you sure you want to delete this report?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `/api/reports/${type}/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Failed to delete report"
            );
        }

        alert("Report deleted successfully!");

        location.reload();

    } catch (error) {

        alert(error.message);

    }

}

</script>
<script src="js/account.js"></script>

</body>
</html>
