<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            Campus<span>Find</span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="items.html">Browse Items</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="register.html">Create Account</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your CampusFind account.
            </p>


            <form action="/login" method="POST">
                
                <div class="form-group">

    <label for="accessPassword">
        College Access Password
    </label>

    <input
        type="password"
        id="accessPassword"
        name="accessPassword"
        placeholder="Enter college access password"
        required
    >

</div>

                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>

</body>
</html>
