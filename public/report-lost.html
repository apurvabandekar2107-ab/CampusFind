<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item | CampusFind</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="navbar">

        <div class="logo">
            Campus<span>Find</span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="items.html">Browse Items</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🔍
            </div>

            <h1>Report Lost Item</h1>

            <p class="auth-subtitle">
                Tell us about the item you lost on campus.
            </p>


            <form
    action="/report-lost"
    method="POST"
    enctype="multipart/form-data"
>
                <div class="form-group">

                    <label for="item_name">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="item_name"
                        name="item_name"
                        placeholder="Example: Black Backpack"
                        required
                    >

                </div>
                <div class="form-group">

                    <label for="itemImage">
                        Item Image
                    </label>

                    <input
    type="file"
    id="itemImage"
    name="image"
    accept="image/*"
    capture="environment"
>

</div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="Describe your item"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="location">
                        Lost Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: College Library"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lost_date">
                        Date Lost
                    </label>

                    <input
                        type="date"
                        id="lost_date"
                        name="lost_date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contact">
                        Contact Information
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Email or phone number"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Submit Lost Item
                </button>

            </form>


            <p class="auth-footer">

                <a href="dashboard.html">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </main>

</body>
</html>
